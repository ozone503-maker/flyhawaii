<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:720px;height:1280px;overflow:hidden;background:#06121f;font-family:"Inter Display","Inter",sans-serif}
#st{position:absolute;inset:0;overflow:hidden}
#bg{position:absolute;top:0;height:1280px;width:auto;left:0;transform-origin:0 0}
#tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,14,28,.55) 0%,rgba(4,14,28,.05) 34%,rgba(4,14,28,.0) 55%,rgba(4,14,28,.78) 100%)}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(30,200,255,.05) 0 2px,transparent 2px 5px);mix-blend-mode:screen}
#who{position:absolute;left:50%;bottom:250px;width:520px;height:560px;transform-origin:50% 100%}
#who img{position:absolute;left:0;right:0;bottom:0;margin:auto;max-width:100%;max-height:100%;width:auto;height:100%;object-fit:contain;
 filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 10px rgba(30,200,255,.55)) drop-shadow(0 18px 18px rgba(0,0,0,.5))}
#cap{position:absolute;left:40px;right:40px;top:120px;text-align:center;font-weight:900;font-size:66px;line-height:1.06;letter-spacing:-.01em;color:#fff;text-transform:uppercase;
 text-shadow:0 4px 0 rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.45)}
#cap span{display:inline-block;margin:0 .14em;transform-origin:50% 80%;opacity:0}
#cap span.k{color:#1ec8ff;text-shadow:0 0 14px rgba(30,200,255,.9),0 0 34px rgba(30,200,255,.7),0 4px 0 #03243f}
#tag{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);min-width:420px;max-width:640px;padding:16px 34px 18px;text-align:center;color:#fff;
 background:linear-gradient(180deg,rgba(8,30,52,.92),rgba(4,16,30,.92));
 clip-path:polygon(22px 0,calc(100% - 22px) 0,100% 22px,100% calc(100% - 22px),calc(100% - 22px) 100%,22px 100%,0 calc(100% - 22px),0 22px);
 box-shadow:inset 0 0 0 2px rgba(30,200,255,.7)}
#tag::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(30,200,255,.08) 0 2px,transparent 2px 4px)}
#tag b{display:block;font-weight:900;font-size:46px;line-height:1.05}
#tag i{display:block;font-style:normal;font-weight:650;font-size:26px;color:#9fe6ff;margin-top:4px}
#tagline{position:absolute;left:50%;bottom:118px;height:4px;transform:translateX(-50%);background:#1ec8ff;box-shadow:0 0 14px #1ec8ff}
.coin{position:absolute;width:84px;height:84px;left:-42px;top:-42px;color:#1ec8ff;filter:drop-shadow(0 0 8px #1ec8ff) drop-shadow(0 0 20px rgba(30,200,255,.85))}
#flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 62%,rgba(30,200,255,.55),rgba(30,200,255,0) 60%);opacity:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="g-kdu" viewBox="0 0 24 24"><path d="M12 1.5 21.5 7v10L12 22.5 2.5 17V7Z" fill="currentColor" opacity=".9"/><path d="M12 6v12M12 12 7.5 8.5M12 12l4.5-3.5M8 15.5h8" fill="none" stroke="#03243f" stroke-width="1.9"/></symbol></svg>
<div id="st"><img id="bg"><div id="tint"></div><div id="flash"></div><div id="who"><img id="pic"></div><div id="cap"></div><div id="coins"></div><div id="tagline"></div><div id="tag"><b id="nm"></b><i id="bz"></i></div><div id="scan"></div></div>
<script>
const $=id=>document.getElementById(id);
let S=null,W=[],coins=[];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const spring=x=>{x=clamp(x);return 1-Math.exp(-6*x)*Math.cos(10*x)};
function rnd(seed){let s=seed;return()=>((s=(s*9301+49297)%233280)/233280)}
window.setup=async(spec,timing)=>{
  S=spec;S.t=timing;
  $('bg').src='bg/'+spec.bg+'.webp';$('pic').src='locals/'+spec.portrait+'.webp';
  $('nm').textContent=spec.name;$('bz').textContent=spec.biz;
  const cap=$('cap');cap.innerHTML='';W=[];
  spec.cap.split(' ').forEach((w,i)=>{const s=document.createElement('span');s.textContent=w;if(/kudoken/i.test(w))s.className='k';cap.appendChild(s);W.push(s)});
  const c=$('coins');c.innerHTML='';coins=[];const r=rnd(spec.id.length*97+7);
  for(let i=0;i<22;i++){const e=document.createElementNS('http://www.w3.org/2000/svg','svg');e.setAttribute('viewBox','0 0 24 24');e.classList.add('coin');
    e.innerHTML='<use href="#g-kdu"/>';c.appendChild(e);
    const a=-Math.PI/2+(r()-.5)*2.6;coins.push({e,a,sp:260+r()*300,d:i*0.028,spin:(r()<.5?-1:1)*(2+r()*3),s:.7+r()*.6})}
  await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
};
window.render=t=>{
  const T=S.t;
  // background pan
  const bg=$('bg');const bw=bg.naturalWidth*1280/bg.naturalHeight, z=1.06+0.04*(t/6);
  const room=bw*z-720;const p=clamp(S.px+S.pd*0.12*(t/6));bg.style.transform=`translateX(${-room*p}px) scale(${z})`;bg.style.width=bw+'px';
  // character entrance and talk bob
  const e=spring((t-0.05)/0.55);let talk=0;
  T.words.forEach(([a,b])=>{if(t>=a&&t<b){talk=Math.sin(Math.PI*(t-a)/(b-a))}});
  const hop=t>T.burst&&t<T.burst+0.5?Math.sin(Math.PI*(t-T.burst)/0.5):0;
  $('who').style.transform=`translateX(-50%) translateY(${(1-e)*620 - hop*28}px) scale(${1+talk*0.025-hop*0.02},${1-talk*0.03+hop*0.04}) rotate(${Math.sin(t*3.1)*1.2}deg)`;
  // caption words
  T.words.forEach(([a,b],i)=>{const s=W[i];const k=clamp((t-a)/0.16);s.style.opacity=k>0?1:0;
    const pop=k<1?0.4+0.6*spring(k)*1.0:1;const act=t>=a&&t<b+0.08;
    s.style.transform=`scale(${pop*(act?1.08:1)}) translateY(${(1-ease(k))*18}px)`;
    if(!s.classList.contains('k'))s.style.color=act?'#ffe36a':'#fff'});
  // name tag
  const g=ease((t-0.25)/0.4);$('tag').style.opacity=g;$('tag').style.transform=`translateX(-50%) translateY(${(1-g)*40}px)`;
  $('tagline').style.width=(g*520)+'px';
  // coins
  const tb=T.burst,ox=360,oy=1280-250-320;
  coins.forEach(c=>{const u=t-tb-c.d;if(u<0){c.e.style.opacity=0;return}
    const k=u/1.5;const x=ox+Math.cos(c.a)*c.sp*ease(k*1.4),y=oy+Math.sin(c.a)*c.sp*0.85*ease(k*1.4)+ (k>0.6? -Math.pow(k-0.6,2)*900:0);
    const tx=660,ty=60,m=clamp((k-0.75)/0.6);const X=x+(tx-x)*ease(m),Y=y+(ty-y)*ease(m);
    c.e.style.opacity=(1-clamp((k-1.15)/0.25));
    c.e.style.transform=`translate(${X}px,${Y}px) scale(${c.s*(0.3+0.7*ease(k*3))*(1-0.5*m)}) rotateY(${u*c.spin*180}deg)`});
  $('flash').style.opacity=t>tb?Math.max(0,1-(t-tb)/0.5)*0.9:0;
};
</script></body></html>
